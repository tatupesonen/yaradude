{% extends "base.html" %}
{% block title %}Bad request{% endblock %}
{% block content %}
<div class="mx-auto mt-6 max-w-xl sm:mt-16">
  <p class="eyebrow">Error 400</p>
  <h1 class="mt-1 text-2xl">The request could not be processed</h1>
  <p class="mt-3 text-muted">The browser sent something the server could not accept, for example an upload that is too large or has too many files.</p>
  <div class="mt-6"><a class="btn btn-primary" href="/">Back to the start page</a></div>
</div>
{% endblock %}
