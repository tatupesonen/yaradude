{% extends "base.html" %}
{% block title %}Server error{% endblock %}
{% block content %}
<div class="mx-auto mt-6 max-w-xl sm:mt-16">
  <p class="eyebrow">Error 500</p>
  <h1 class="mt-1 text-2xl">Something went wrong on the server</h1>
  <p class="mt-3 text-muted">The error has been logged. Try again; if it keeps happening, tell an administrator what you were doing and when.</p>
  <div class="mt-6"><a class="btn btn-primary" href="/">Back to the start page</a></div>
</div>
{% endblock %}
