<span class="flex min-w-0 items-center gap-1"><span id="{{ id }}" class="min-w-0 truncate font-mono text-xs{% if extra_class %} {{ extra_class }}{% endif %}" title="{{ value }}">{{ value }}</span><button type="button" class="btn btn-ghost btn-sm shrink-0 px-1.5 py-0.5" data-copy="#{{ id }}" aria-label="Copy {{ label|default:'hash' }}" hidden>Copy</button></span>
