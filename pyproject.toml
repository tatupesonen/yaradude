[project]
name = "yaradude"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "channels>=4.3.2",
    "django>=6.1.3",
    "django-tasks-db==0.13.0",
    "gunicorn>=27.0.1",
    "pygments>=2.21.0",
    "uvicorn>=0.54.0",
    "whitenoise>=6.12.0",
    "wsproto>=1.3.2",
    "yara-x>=1.23.0",
]

[dependency-groups]
dev = [
    "django-tailwind-cli==4.9.0",
    "django-types>=0.24.0",
    "ruff>=0.17.6",
    "ty==0.0.107",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

# ty (Astral's type checker) runs without a Django plugin; the plugin-free
# django-types stubs supply Django's types. PLAN.md section 9.1 records why.
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["**/migrations/"]

[tool.ty.rules]
# Stricter than the defaults: every suppression names its rule and is removed
# once it is no longer needed, and partially bound names are errors.
blanket-ignore-comment = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
